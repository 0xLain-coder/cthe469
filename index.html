  const minsTime = time => {const [h,m]=time.split(":").map(Number);return h*60+m;};
  const clockTime = mins => `${String(Math.floor((mins%1440)/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
  const durationLabel = n => `${n}m`;
  function timeline(date=selectedDate,mode=dayData(date).mode) {
    const weekday=dateObj(date).getDay()!==0&&dateObj(date).getDay()!==6;
    if(weekday&&mode==="Lite")return LITE;

  }
  function getBlocks(date=selectedDate,mode=dayData(date).mode) {
    const list=timeline(date,mode);return list.map((item,i)=>{let start=minsTime(item[0]); if(i && start<minsTime(list[i-1][0]))start+=1440;return {time:item[0],name:item[1],duration:item[2],category:item[3],start,end:start+item[2]};});
  }
  function isStudy(block){return ["FOM","Physics","Chemistry","CS + English","REV"].includes(block.category);}

  function deloadInfo(date=selectedDate) {

  function renderToday() {

      ${renderTallyCard(d)}${renderSleepCard(d)}

  function renderTallyCard(d) {

    const d=dayData(),now=new Date(),current=now.getHours()*60+now.getMinutes(),dayOffset=dateObj(selectedDate).toDateString()===new Date().toDateString()?0:1,overnight=dayOffset===0&&current<minsTime(blocks[0].time);

          <div class="field"><label for="err-fix">Fix</label><input id="err-fix" name="fix" required placeholder="What will prevent it?"></div>
          <div class="field"><label for="err-resolve">Re-solve date</label><input id="err-resolve" name="resolveDate" type="date"></div>
          <div class="field" style="grid-column:1/-1"><label for="err-result">Re-solve result / note</label><input id="err-result" name="result" placeholder="Optional"></div>
        </div></div><footer class="modal-footer"><button type="button" class="btn ghost" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save entry</button></footer></form></section></div>`;
      setTimeout(()=>$("#err-ref")?.focus(),0);
    }
  }
  function getPath(path) {
    if(path.startsWith("daily."))return {root:dayData(),path:path.slice(6)};
    if(path.startsWith("week."))return {root:reviewData(),path:path.slice(5)};
    return null;
  }
  function setNested(root,path,value) {const parts=path.split(".");let o=root;for(let i=0;i<parts.length-1;i++)o=o[parts[i]] ||= {};o[parts.at(-1)]=value;}
  function valueOf(el) {if(el.type==="checkbox")return el.checked;if(el.type==="number")return el.value===""?"":Number(el.value);return el.value;}
  function rerenderIf(page) {if((location.hash||"#today")==="#"+page)render();}
  document.addEventListener("input",e=>{
    const el=e.target;
    if(el.matches("[data-bind]")){const p=getPath(el.dataset.bind);if(p){setNested(p.root,p.path,valueOf(el));save();}}
    if(el.matches("[data-bind-date]")){const date=el.dataset.bindDate;const d=state.daily[date] ||= {tally:{}};setNested(d,el.dataset.bindKey,valueOf(el));save();}
    if(el.matches("[data-setting]")){state.settings[el.dataset.setting]=el.value;save();}
    if(el.matches("[data-key-date]")){const i=Number(el.dataset.keyDate);state.settings.keyDates[i][el.dataset.keyField]=el.value;save();}
  });
  document.addEventListener("change",e=>{
    const el=e.target;
    if(el.matches("[data-action='selected-date']")){selectedDate=el.value||localDate(new Date());openBlock=null;render();return;}
    if(el.matches("[data-bind]")){const p=getPath(el.dataset.bind);if(p){setNested(p.root,p.path,valueOf(el));if(el.dataset.bind==="daily.sleep.lights"||el.dataset.bind==="daily.sleep.wake")dayData().sleepLogged=true;save();if(el.type==="checkbox"||el.tagName==="SELECT")render();else if(el.dataset.bind==="daily.sleep.lights"||el.dataset.bind==="daily.sleep.wake")rerenderIf("today");}return;}
    if(el.matches("[data-bind-date]")){const d=state.daily[el.dataset.bindDate] ||= {tally:{}};setNested(d,el.dataset.bindKey,valueOf(el));save();rerenderIf("errors");return;}
    if(el.matches("[data-setting]")){state.settings[el.dataset.setting]=el.value||START_DEFAULT;save();render();return;}
    if(el.matches("[data-key-date]")){const i=Number(el.dataset.keyDate);state.settings.keyDates[i][el.dataset.keyField]=el.value;save();return;}
    if(el.matches("[data-module-check]")){const id=el.dataset.module,key=el.dataset.moduleCheck;state.modules[id] ||= {};state.modules[id][key]=el.checked;save();render();return;}
    if(el.matches("[data-week-subject]")){const w=reviewData();w.subjects ||= {};w.subjects[el.dataset.weekSubject] ||= {};w.subjects[el.dataset.weekSubject].hit=el.checked;save();return;}
    if(el.matches("[data-week-result]")){const w=reviewData();w.subjects ||= {};w.subjects[el.dataset.weekResult] ||= {};w.subjects[el.dataset.weekResult].result=el.value;save();return;}
  });
  document.addEventListener("click",e=>{
    const target=e.target.closest("button,a,[data-open-block],[data-backdrop]");
    if(!target)return;
    if(target.matches("[data-mode]")){dayData().mode=target.dataset.mode;save();openBlock=null;if(location.hash!=="#today")location.hash="#today";else render();return;}
    if(target.matches("[data-open-block]")){const index=Number(target.dataset.blockIndex);openBlock=openBlock===index?null:index;render();if(openBlock!==null)$("#view [data-detail] input")?.focus();return;}
    if(target.matches("[data-set-status]")){const [key,status]=target.dataset.setStatus.split(":");milestoneData(key).status=status;save();render();return;}
    if(target.matches("[data-error-tab]")){errorTab=target.dataset.errorTab;render();return;}
    if(target.matches("[data-action='new-error']")){modal={type:"error"};renderModal();return;}
    if(target.matches("[data-action='close-modal']")||target.matches("[data-backdrop]")&&e.target===target){modal=null;renderModal();return;}
    if(target.matches("[data-delete-error]")){state.errors=state.errors.filter(x=>x.id!==target.dataset.deleteError);save();render();toast("Error entry removed.");return;}
    if(target.matches("[data-action='export']")){exportData();return;}
    if(target.matches("[data-action='import']")){$("#import-file").click();return;}
    if(target.matches("[data-action='reset']")){if(confirm("Reset all tracker data on this device? This cannot be undone. Export a backup first if you need one.")){state=defaults();save();selectedDate=localDate(new Date());render();toast("Tracker data reset.");}return;}
    if(target.matches("[data-action='add-key-date']")){state.settings.keyDates ||= [];state.settings.keyDates.push({date:selectedDate,title:""});save();render();$$("[data-key-date]").at(-1)?.focus();return;}
    if(target.matches("[data-remove-key-date]")){state.settings.keyDates.splice(Number(target.dataset.removeKeyDate),1);save();render();return;}
    if(target.matches("[data-backdrop]")&&modal){modal=null;renderModal();}
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&modal){modal=null;renderModal();return;}
    if(e.key==="Tab"&&modal){const controls=$$(".modal button:not([disabled]),.modal input:not([disabled]),.modal select:not([disabled]),.modal textarea:not([disabled])"),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}return;}
    if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-open-block]")){e.preventDefault();e.target.click();}
  });
  document.addEventListener("submit",e=>{
    if(e.target.id!=="error-form")return;e.preventDefault();
    const form=new FormData(e.target),entry={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,date:form.get("date"),subject:form.get("subject"),ref:form.get("ref").trim(),mark:form.get("mark"),code:form.get("code"),cause:form.get("cause").trim(),fix:form.get("fix").trim(),resolveDate:form.get("resolveDate"),result:form.get("result").trim()};
    state.errors.push(entry);save();modal=null;errorTab="entries";render();toast("Error entry saved.");
  });
  document.addEventListener("change",async e=>{
    if(e.target.id!=="import-file")return;
    const file=e.target.files?.[0];if(!file)return;
    try {const incoming=JSON.parse(await file.text());if(!incoming||typeof incoming!=="object"||Array.isArray(incoming)||!incoming.settings||typeof incoming.settings!=="object"||Array.isArray(incoming.settings)||!incoming.daily||typeof incoming.daily!=="object"||Array.isArray(incoming.daily)||!incoming.modules||typeof incoming.modules!=="object"||Array.isArray(incoming.modules)||!Array.isArray(incoming.errors)||(incoming.weeks!=null&&(typeof incoming.weeks!=="object"||Array.isArray(incoming.weeks))))throw new Error("This file is not a valid FOM tracker backup.");
      if(confirm("Replace all current tracker data with this backup?")){state={settings:incoming.settings,daily:incoming.daily,modules:incoming.modules,errors:incoming.errors,weeks:incoming.weeks||{}};save();render();toast("Backup imported.");}}
    catch(error){console.error("Could not import tracker backup.",error);alert(`Import failed: ${error.message}`);}finally{e.target.value="";}
  });
  function exportData() {const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`fom-study-tracker-${localDate(new Date())}.json`;a.click();URL.revokeObjectURL(url);toast("Tracker data exported.");}
  window.addEventListener("hashchange",()=>{modal=null;render();});
  render();setInterval(updateTop,1000);
})();
</script>
</body>
</html>
